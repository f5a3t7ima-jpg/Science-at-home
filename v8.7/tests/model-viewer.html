<!doctype html><html><head><meta charset="utf-8"><title>Model inspection</title></head><body style="margin:0;background:#dce4e4"><script type="module">
import * as T from '../vendor/three.module.js';
import {GLTFLoader} from '../vendor/GLTFLoader.js';
const renderer=new T.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
renderer.setSize(600,700);renderer.setPixelRatio(1);renderer.outputColorSpace=T.SRGBColorSpace;
renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;
document.body.append(renderer.domElement);
const scene=new T.Scene(),camera=new T.PerspectiveCamera(34,600/700,.01,100);
scene.add(new T.HemisphereLight(0xffffff,0xa0b6bb,2));
for(const [x,y,z,power] of [[-3,5,5,3],[3,2,2,1.4],[0,4,-3,2]]){const l=new T.DirectionalLight(0xffffff,power);l.position.set(x,y,z);scene.add(l);}
let active,mixer;
window.loadModel=async function(name,clip){
 if(active)scene.remove(active);
 const gltf=await new GLTFLoader().loadAsync('../assets/models/'+(name==='maha'?'maha-portrait':name)+'.glb');
 active=new T.Group();active.add(gltf.scene);scene.add(active);
 mixer=new T.AnimationMixer(gltf.scene);
 if(clip){const c=gltf.animations.find(a=>a.name===clip)||gltf.animations[0];mixer.clipAction(c).play();mixer.setTime(.15);}
 gltf.scene.updateMatrixWorld(true);const box=new T.Box3().setFromObject(gltf.scene),size=box.getSize(new T.Vector3()),centre=box.getCenter(new T.Vector3());
 active.scale.setScalar(2/size.y);gltf.scene.position.sub(centre);active.updateMatrixWorld(true);
 camera.position.set(.2,.12,Math.max(4, size.x/size.y*4.8));camera.lookAt(0,0,0);
 renderer.render(scene,camera);
 window.modelInfo={name,size:size.toArray(),centre:centre.toArray(),bones:[],animations:gltf.animations.map(a=>({name:a.name,duration:a.duration,tracks:a.tracks.slice(0,4).map(t=>({name:t.name,first:Array.from(t.values.slice(0,8))}))}))};
 gltf.scene.traverse(n=>{if(n.isBone)window.modelInfo.bones.push({name:n.name,position:n.position.toArray(),quaternion:n.quaternion.toArray()})});
 return window.modelInfo;
};
window.renderModel=(y=0,time=0)=>{active.rotation.y=y;if(time)mixer.setTime(time);renderer.render(scene,camera);return renderer.domElement.toDataURL('image/png');};
const controls=document.createElement('div');controls.style='position:fixed;left:620px;top:20px;max-width:540px;font:18px Arial;';
controls.innerHTML='<h1>Character inspection</h1><label>Character <select id="model">'+['hessa','hamad','mother','father','grandma','grandpa','fahem','shaheen','maha'].map(x=>'<option>'+x+'</option>').join('')+'</select></label><p><label>Animation <select id="clip"><option value="">Rest pose</option></select></label></p><button id="turn">Turn around</button> <button id="save">Download portrait</button><pre id="info" style="white-space:pre-wrap;font:14px monospace"></pre>';
document.body.append(controls);let angle=0;
async function refresh(){try{const info=await loadModel(document.querySelector('#model').value,document.querySelector('#clip').value);document.querySelector('#info').textContent=JSON.stringify(info,null,2);window.currentModel=info.name;}catch(error){document.querySelector('#info').textContent=error.stack;}}
document.querySelector('#model').onchange=async()=>{document.querySelector('#clip').value='';await refresh();document.querySelector('#clip').innerHTML='<option value="">Rest pose</option>'+window.modelInfo.animations.map(a=>'<option>'+a.name+'</option>').join('');};
document.querySelector('#clip').onchange=refresh;
document.querySelector('#turn').onclick=()=>{angle+=Math.PI;window.renderModel(angle);};
document.querySelector('#save').onclick=()=>{const a=document.createElement('a');a.href=window.renderModel(0);a.download=currentModel+'.png';a.click();};
window.ready=true;await refresh();document.querySelector('#clip').innerHTML='<option value="">Rest pose</option>'+window.modelInfo.animations.map(a=>'<option>'+a.name+'</option>').join('');
</script></body></html>
